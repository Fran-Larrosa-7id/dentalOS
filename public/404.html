<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>DentalOS</title>
    <script>
      (function () {
        var prefix = '/dentalOS';
        var path = window.location.pathname;
        var route = path.indexOf(prefix + '/') === 0 ? path.slice(prefix.length) : '/today';
        var target = prefix + '/today?__spa=' + encodeURIComponent(route + window.location.search + window.location.hash);
        window.location.replace(target);
      })();
    </script>
  </head>
  <body></body>
</html>

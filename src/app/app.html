@if (isFloor()) {
  <router-outlet />
} @else {
  <div class="min-h-dvh bg-[var(--bg-app)] lg:grid lg:grid-cols-[256px_1fr]">
    <aside
      class="app-shell-sidebar border-b border-slate-800 px-4 py-6 text-slate-100 lg:min-h-dvh lg:border-r lg:border-b-0 lg:px-5"
    >
      <div class="brand-orbit brand-orbit-top" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="brand-orbit brand-orbit-bottom" aria-hidden="true">
        <i></i><i></i><i></i><i></i>
      </div>
      <a
        routerLink="/today"
        aria-label="Ir al inicio de DentalOS"
        class="flex items-center gap-3 px-2 text-[40px] font-bold tracking-tight text-white lg:gap-2.5 lg:text-[22px]"
        ><img
          src="assets/detanlos-isologo-color.svg"
          alt=""
          aria-hidden="true"
          class="h-11 w-11 shrink-0 object-contain lg:h-10 lg:w-10"
        /><span>DentalOS</span></a
      >
      <p class="mt-10 px-3 text-[10px] font-bold tracking-[.18em] text-slate-500">OPERACIÓN</p>
      <nav
        class="mt-3 flex gap-1 overflow-x-auto lg:block lg:space-y-1"
        aria-label="Navegación principal"
      >
        <a
          routerLink="/today"
          routerLinkActive="border-l-2 border-blue-500 bg-slate-800 text-white"
          class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
          ><app-icon name="home" class="size-4" />Inicio</a
        >
        <a
          routerLink="/production"
          routerLinkActive="border-l-2 border-blue-500 bg-slate-800 text-white"
          class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
          ><app-icon name="briefcase" class="size-4" />Producción</a
        >
        <a
          routerLink="/orders"
          routerLinkActive="border-l-2 border-blue-500 bg-slate-800 text-white"
          class="flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
          ><app-icon name="document" class="size-4" />Órdenes</a
        >
        <p class="mt-7 px-3 text-[10px] font-bold tracking-[.18em] text-slate-500">DIRECTORIO</p>
        <a
          routerLink="/dentists"
          routerLinkActive="border-l-2 border-blue-500 bg-slate-800 text-white"
          class="mt-2 flex items-center gap-3 whitespace-nowrap rounded-md px-3 py-2.5 text-sm font-medium text-slate-300 hover:bg-slate-800 hover:text-white"
          ><app-icon name="briefcase" class="size-4" />Odontólogos</a
        >
      </nav>
      <a
        routerLink="/orders/new"
        class="brand-cta mt-8 flex items-center justify-center gap-2 rounded-lg px-4 py-3 text-center text-sm font-bold text-white shadow-sm"
        ><app-icon name="plus" class="size-4" />Nueva orden</a
      >
      <a
        routerLink="/settings"
        class="mt-5 block px-3 py-2 text-sm font-medium text-slate-400 hover:text-white"
        >Configuración</a
      >
    </aside>
    <div class="min-w-0">
      <main class="mx-auto max-w-[1360px] p-5 md:p-8 lg:p-10"><router-outlet /></main>
    </div>
  </div>
}
